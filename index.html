/* ============================ scanning for things that changed ============================
 Everything above only ever asks "what got brighter?" — the motion detector literally
 tested d>thr on already-bright pixels, so an unlit object could never trip it. Two
 methods here look for change of either sign.

 DIFFERENCE IMAGING. The sky-aligned stack is a reference image of the static sky. Warp
 the live frame into the same attitude, subtract, and whatever is left moved: a light
 shows as a positive residual, a dark shape against skyglow as a negative one. The
 difference is normalised by its own median first, so a phone auto-exposure step shifts
 every pixel equally and cancels instead of reading as a whole-sky event.

 OCCULTATION. With the pointing solved to a fraction of a degree the app knows where
 every catalogue star should be, so it can watch each one's brightness frame by frame.
 Something unlit crossing the field puts a star out briefly. The test that makes this
 real rather than noise is differential: cloud, haze, a hand over the lens or an
 exposure change dim many stars together, while an occultation takes one or two while
 their neighbours hold steady. Transits run about a second for an airliner at altitude
 and a few frames for a balloon; a bird up close is one frame and will be missed.
========================================================================================= */
function ensureScanCanvas(){
  if(!SCAN.dcur){
    SCAN.dcur=document.createElement('canvas');
    SCAN.dctx=SCAN.dcur.getContext('2d',{willReadFrequently:true});
    SCAN.dref=document.createElement('canvas');
    SCAN.rctx=SCAN.dref.getContext('2d',{willReadFrequently:true});
  }
  if(SCAN.dcur.width!==GW||SCAN.dcur.height!==GH){
    SCAN.dcur.width=GW;SCAN.dcur.height=GH;
    SCAN.dref.width=GW;SCAN.dref.height=GH;
  }
}
/* separable 3-tap box blur, in place */
function blur3(g){
  const t=new Float32Array(NPX);
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){
    const i=y*GW+x,l=x>0?g[i-1]:g[i],r=x<GW-1?g[i+1]:g[i];
    t[i]=(l+g[i]+r)/3;}
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){
    const i=y*GW+x,u=y>0?t[i-GW]:t[i],dn=y<GH-1?t[i+GW]:t[i];
    g[i]=(u+t[i]+dn)/3;}
}
function scanDiff(){
  if(!STACK.on||STACK.n<12||!STACK.ref||!basis)return null;
  const vw=video.videoWidth,vh=video.videoHeight;
  if(!vw||!vh)return null;
  const M=alignAffine();if(!M)return null;
  ensureScanCanvas();
  const W=overlay.width,H=overlay.height,sx=GW/W,sy=GH/H;
  SCAN.dctx.setTransform(1,0,0,1,0,0);SCAN.dctx.clearRect(0,0,GW,GH);
  SCAN.dctx.setTransform(sx*M.a,sy*M.b,sx*M.c,sy*M.d,sx*M.e,sy*M.f);
  drawCameraFrame(SCAN.dctx,W,H);
  SCAN.dctx.setTransform(1,0,0,1,0,0);
  SCAN.rctx.clearRect(0,0,GW,GH);
  SCAN.rctx.drawImage(STACK.acc,0,0,W,H,0,0,GW,GH);
  const a=SCAN.dctx.getImageData(0,0,GW,GH).data;
  const b=SCAN.rctx.getImageData(0,0,GW,GH).data;
  const ga=new Float32Array(NPX),gb=new Float32Array(NPX);
  for(let i=0,p=0;i<NPX;i++,p+=4){
    ga[i]=a[p]*0.299+a[p+1]*0.587+a[p+2]*0.114;
    gb[i]=b[p]*0.299+b[p+1]*0.587+b[p+2]*0.114;}
  /* Blur both to a common resolution before subtracting. The stacked reference is
     slightly softened by the sub-pixel jitter it averaged over while the live frame is
     sharp, so without this every star leaves a bright residual and drowns the real
     detections. This is the cheap end of PSF matching. */
  blur3(ga);blur3(gb);
  const d=new Float32Array(NPX);
  for(let i=0;i<NPX;i++)d[i]=ga[i]-gb[i];
  /* median and MAD: a robust zero point and scale, so a global exposure shift cancels
     and a handful of real outliers cannot inflate the threshold that would find them */
  const samp=[];for(let i=0;i<NPX;i+=7)samp.push(d[i]);
  samp.sort((x,y)=>x-y);
  const med=samp[samp.length>>1];
  const dev=samp.map(x=>Math.abs(x-med));dev.sort((x,y)=>x-y);
  const mad=Math.max(1.2,dev[dev.length>>1]*1.4826);
  SCAN.noise=mad;
  const thr=Math.max(4*mad,10);
  /* Known stars are masked out: whatever residual they leave is registration, not a
     new object, and the app knows exactly where they are. */
  const mask=[];
  for(const st of starsUp){
    if(st.el<=0||st.mag>4.5)continue;
    const p=project(st.az,st.el);if(!p)continue;
    mask.push(screenToProc(p.x,p.y));
  }
  const out=[];
  for(let y=4;y<GH-4;y++)for(let x=4;x<GW-4;x++){
    const v=d[y*GW+x]-med,av=Math.abs(v);
    if(av<thr)continue;
    let masked=false;
    for(const m of mask)if(Math.abs(m.x-x)<3&&Math.abs(m.y-y)<3){masked=true;break;}
    if(masked)continue;
    if(av<Math.abs(d[y*GW+x-1]-med)||av<Math.abs(d[y*GW+x+1]-med)||
       av<Math.abs(d[(y-1)*GW+x]-med)||av<Math.abs(d[(y+1)*GW+x]-med))continue;
    let hit=null;
    for(const o of out)if(Math.abs(o.x-x)<4&&Math.abs(o.y-y)<4){hit=o;break;}
    if(hit){if(av>Math.abs(hit.v)){hit.x=x;hit.y=y;hit.v=v;}}
    else out.push({x,y,v});
  }
  return out.sort((p,q)=>Math.abs(q.v)-Math.abs(p.v)).slice(0,8);
}
/* a single frame proves nothing; require the same thing in the same place repeatedly */
function mergeEvents(blobs){
  const now=Date.now();
  (blobs||[]).forEach(b=>{
    const sc=procToScreen(b.x,b.y);
    const q=basis?unproject(sc.x,sc.y):null;
    if(!q)return;
    const sign=b.v<0?-1:1;
    let m=null;
    for(const e of SCAN.events)
      if(e.sign===sign&&angSepDeg(e.az,e.el,q.az,q.el)<2.5){m=e;break;}
    if(m){m.az=q.az;m.el=q.el;m.v=b.v;m.last=now;m.n++;}
    else SCAN.events.push({az:q.az,el:q.el,v:b.v,sign,first:now,last:now,n:1});
  });
  SCAN.events=SCAN.events.filter(e=>now-e.last<3000);
}
const scanConfirmed=()=>SCAN.events.filter(e=>e.n>=3);
function scanOccult(gray){
  if(!basis||!starsUp.length)return;
  const now=Date.now(),seen=[];
  for(const st of starsUp){
    if(st.el<=0||st.mag>3.9)continue;
    const p=project(st.az,st.el);if(!p)continue;
    const q=screenToProc(p.x,p.y);
    const bl=findBlob(gray,q.x,q.y,3,1,0);
    const flux=bl?Math.max(0,bl.contrast):0;
    let rec=SCAN.base.get(st.name);
    if(!rec){rec={ema:flux,dip:0,t0:0};SCAN.base.set(st.name,rec);}
    seen.push({st,flux,rec});
  }
  SCAN.nStars=seen.length;
  if(seen.length<4)return;
  seen.forEach(o=>{o.dip=o.rec.ema>6&&o.flux<0.45*o.rec.ema;});
  const nDip=seen.filter(o=>o.dip).length;
  /* many stars dimming at once is weather or exposure, never a discrete object */
  SCAN.globalDim=nDip/seen.length>0.3;
  seen.forEach(o=>{
    if(o.dip&&!SCAN.globalDim){
      if(!o.rec.dip){o.rec.dip=1;o.rec.t0=now;}
      return;                                  // baseline frozen so it cannot chase the dip
    }
    if(o.rec.dip){
      const ms=now-o.rec.t0;
      if(ms>=120&&ms<8000){
        SCAN.occ.push({name:o.st.name,az:o.st.az,el:o.st.el,ms,
          depth:1-o.flux/Math.max(1,o.rec.ema),t:now,others:seen.length});
        if(SCAN.occ.length>12)SCAN.occ.shift();
      }
      o.rec.dip=0;
    }
    o.rec.ema=o.rec.ema*0.96+o.flux*0.04;
  });
}
function runScan(gray){
  if(!SCAN.on||!running)return;
  const now=Date.now();
  if(now-SCAN.last<100)return;                 // ~10 Hz is plenty and saves battery
  SCAN.last=now;
  mergeEvents(scanDiff());
  scanOccult(gray);
}
function setScan(on){
  SCAN.on=on;
  $('scanBtn').dataset.on=on?'1':'0';
  if(on){
    SCAN.events=[];SCAN.occ=[];SCAN.base.clear();
    setStatus('Scanning for change of either sign — a light, or something unlit crossing '+
      (STACK.on?'the stack':'the sky')+'. Turn Stack on as well: difference imaging needs '+
      'the aligned reference frame it builds.','ok');
  }else setStatus('Scan off.','');
  renderSheet();
}

/* ============================ render + detection loop ============================ */
/* The overlay runs on its own: the sky map still works when the camera is
   unavailable or denied, and only the motion detector needs a live video frame. */
/* The detector canvas is sized to the display's aspect and filled with exactly the
   region object-fit:cover shows, so proc pixels and screen pixels differ by one
   uniform scale. Without that, a tapped light and its image blob are not the same
   place: the old code squashed the whole frame into 256x192 but mapped it back as
   though it had been cover-cropped. */
let GW=1,GH=1,NPX=1;
function sizeProc(){
  const W=overlay.width,H=overlay.height,L=192;
  const w=W>=H?L:Math.max(1,Math.round(L*W/H));
  const h=W>=H?Math.max(1,Math.round(L*H/W)):L;
  if(w!==GW||h!==GH){proc.width=GW=w;proc.height=GH=h;NPX=GW*GH;prev=null;}
}
/* The one place the camera's visible region is defined. The detector, the stack and
   the difference imager all draw through this, so they cannot disagree about framing.
   Target aspect matches the display, so the crop is the same at any output size. */
function drawCameraFrame(ctx,W,H){
  const vw=video.videoWidth,vh=video.videoHeight;
  if(!vw||!vh)return false;
  const k=Math.max(W/vw,H/vh),cw=W/k,ch=H/k;
  ctx.drawImage(video,(vw-cw)/2,(vh-ch)/2,cw,ch,0,0,W,H);
  return true;
}
function grabFrame(){return drawCameraFrame(pctx,GW,GH);}
const procToScreen=(x,y)=>({x:x/GW*overlay.width, y:y/GH*overlay.height});
const screenToProc=(x,y)=>({x:x/overlay.width*GW, y:y/overlay.height*GH});
let rafOn=false;
function startLoop(){if(!rafOn){rafOn=true;requestAnimationFrame(loop);}}
function loop(){
  let gray=null,rgb=null;
  if(running){
    sizeProc();
    if(grabFrame()){
      rgb=pctx.getImageData(0,0,GW,GH).data;gray=new Float32Array(NPX);
      for(let i=0,p=0;i<NPX;i++,p+=4)gray[i]=rgb[p]*0.299+rgb[p+1]*0.587+rgb[p+2]*0.114;
    }
  }
  if(gray){trackLock(gray,rgb);runScan(gray);}
  stackFrame();
  drawOverlay();
  if(gray&&prev){
    const thr=+$('sens').value;let changed=0,best=-1,bx=0,by=0;
    for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){const i=y*GW+x,d=gray[i]-prev[i];
      if(d>thr&&gray[i]>70){changed++;if(d>best){best=d;bx=x;by=y;}}}
    if(cooldown>0)cooldown--;
    if(best>0&&changed/NPX<0.03){
      const q=procToScreen(bx,by);
      octx.strokeStyle=changed/NPX<0.006?pal('hit'):pal('warn');octx.lineWidth=2;
      octx.beginPath();octx.arc(q.x,q.y,17,0,7);octx.stroke();
      lastMotion={x:q.x,y:q.y,t:Date.now()};
      if(cooldown===0){hitCount++;$('hHit').textContent=hitCount;cooldown=25;}
    }
  }
  prev=gray;requestAnimationFrame(loop);
}

/* ============================ image analysis ============================ */
let analysis=null;
function analyze(cap,aimBasis,aimFov){
  const AW=256,AH=Math.round(256*cap.height/cap.width);
  const c=document.createElement('canvas');c.width=AW;c.height=AH;
  const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(cap,0,0,AW,AH);
  const d=ctx.getImageData(0,0,AW,AH).data;
  let sum=0;const lum=new Float32Array(AW*AH);
  for(let i=0,p=0;i<AW*AH;i++,p+=4){const L=d[p]*0.299+d[p+1]*0.587+d[p+2]*0.114;lum[i]=L;sum+=L;}
  const mean=sum/(AW*AH), thr=Math.max(mean+45,150);
  // local maxima above threshold
  const pts=[];
  for(let y=1;y<AH-1;y++)for(let x=1;x<AW-1;x++){const i=y*AW+x,L=lum[i];
    if(L<thr)continue;
    if(L>=lum[i-1]&&L>=lum[i+1]&&L>=lum[i-AW]&&L>=lum[i+AW]){
      const p=(y*AW+x)*4;pts.push({x,y,L,r:d[p],g:d[p+1],b:d[p+2]});}}
  // dedupe near-duplicates
  pts.sort((a,b)=>b.L-a.L);const keep=[];
  pts.forEach(pt=>{if(!keep.some(k=>Math.abs(k.x-pt.x)<4&&Math.abs(k.y-pt.y)<4))keep.push(pt);});
  const top=keep.slice(0,12);
  // pixel -> az/el through the aim frozen at capture time
  const aim=aimBasis?unproject(overlay.width/2,overlay.height/2,aimBasis,aimFov):null;
  // candidate set for matching: dynamic knowns + full-catalog sats + stars + deep sky
  const engC=engineVisible()
    .filter(o=>o.el*R2D>0&&(o.type==='P'||on('debris')))
    .map(o=>({name:o.name,az:rev(o.az*R2D),el:o.el*R2D,kind:'sat'}));
  const cands=knowns.concat(engC,
    starsUp.filter(s=>s.mag<=+$('smag').value+0.5).map(s=>({name:s.name,az:s.az,el:s.el,kind:'star'})),
    dsoUp.map(o=>({name:o.name,az:o.az,el:o.el,kind:'dso'})));
  top.forEach(pt=>{
    const q=aimBasis?unproject(pt.x/AW*overlay.width,pt.y/AH*overlay.height,aimBasis,aimFov):null;
    if(!q){pt.az=null;pt.el=null;return;}
    pt.az=q.az;pt.el=q.el;
    // match to candidates within 6°
    let bestM=null,bd=6;
    cands.forEach(o=>{const da=shortAngle(o.az-pt.az),de=o.el-pt.el,dist=Math.hypot(da,de);
      if(dist<bd){bd=dist;bestM=o;}});
    pt.match=bestM?bestM.name:'UNMATCHED';pt.matchKind=bestM?bestM.kind:'unknown';
  });
  analysis={mean:mean.toFixed(1),count:top.length,pts:top,
    when:new Date().toLocaleTimeString(),
    gps:me?`${me.lat.toFixed(4)}, ${me.lon.toFixed(4)}`:'—',
    aim:aim?`${Math.round(aim.az)}° / ${Math.round(aim.el)}°`:'—',
    moon:(()=>{const il=moonIllum(new Date());return `${Math.round(il.fraction*100)}% ${phaseName(il.phase)}`;})()};
}

initStack();
const _colCache={};
function cssColor(v){const k=v.replace('var(','').replace(')','');
  return _colCache[k]||(_colCache[k]=
    (getComputedStyle(document.documentElement).getPropertyValue(k)||'').trim()||'#fff');}
/* Overlay colours come from the same tokens as the interface, so night vision
   reaches the drawn sky instead of leaving a red panel under a blue star field. */
function pal(name,a){
  const key=name+'|'+(a==null?'':a);
  if(_colCache[key])return _colCache[key];
  const c=cssColor('var(--'+name+')');
  let out=c;
  if(a!=null){
    const m=/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(c);
    if(m){let h=m[1];if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
      out='rgba('+parseInt(h.slice(0,2),16)+','+parseInt(h.slice(2,4),16)+','+
          parseInt(h.slice(4,6),16)+','+a+')';}
  }
  return(_colCache[key]=out);
}
function renderSheet(){
  const b=$('sheetBody');

    if(!knowns.length&&!starsUp.length){b.innerHTML='<div class="hint">No objects above horizon yet, or waiting on GPS.</div>';return;}
    const order={sun:0,moon:1,planet:2,sat:3,air:4};
    let html=[...knowns].sort((a,b)=>(order[a.kind]-order[b.kind])||b.el-a.el).map(o=>
      `<div class="obj"><span class="nm"><span class="dot" style="background:${cssColor(o.color)}"></span>${o.name}</span>`+
      `<span class="v">az ${Math.round(o.az)}° · el ${Math.round(o.el)}°${o.meta?' · '+o.meta:''}</span></div>`).join('');
    /* full-catalog engine summary + brightest sunlit payloads overhead */
    if(engineReady){
      const st=SATENGINE.stats();
      const eng=engineVisible().filter(o=>o.type==='P'&&o.sunlit&&o.el*R2D>0)
        .sort((a,b)=>a.rangeKm-b.rangeKm).slice(0,8);
      html+=eng.map(o=>
        `<div class="obj"><span class="nm"><span class="dot" style="background:var(--sat)"></span>${o.name}</span>`+
        `<span class="v">az ${Math.round(rev(o.az*R2D))}° · el ${Math.round(o.el*R2D)}° · ${Math.round(o.rangeKm)}km ☀</span></div>`).join('');
      html+=`<div class="hint" style="padding:.25rem 0">⬤ ${st.visible} catalog objects above horizon of ${st.total}${stats_gen()}</div>`;
    }
    /* brightest stars currently up */
    const lim=+$('smag').value;
    const bright=starsUp.filter(s=>s.el>0&&s.mag<=lim).sort((a,b)=>a.mag-b.mag).slice(0,8);
    if(bright.length)html+=bright.map(s=>
      `<div class="obj"><span class="nm"><span class="dot" style="background:var(--star)"></span>${s.name}</span>`+
      `<span class="v">az ${Math.round(s.az)}° · el ${Math.round(s.el)}° · m${s.mag.toFixed(1)}</span></div>`).join('');
    const nStars=starsUp.filter(s=>s.el>0&&s.mag<=lim).length;
    html+=`<div class="hint" style="padding:.25rem 0">★ ${nStars} stars ≤ m${lim.toFixed(1)} up · ${dsoUp.length} deep-sky up</div>`;
    /* scan results sit above the routine sky list — they are the reason to look */
    if(SCAN.on){
      const conf=scanConfirmed();
      html+='<div class="hint" style="padding:.35rem 0 .1rem">scan · noise ±'+
        SCAN.noise.toFixed(1)+' · '+SCAN.nStars+' stars watched'+
        (SCAN.globalDim?' · <span style="color:var(--warn)">whole sky dimming (cloud or exposure) — occultation suppressed</span>':'')+
        (STACK.on?'':' · <span style="color:var(--warn)">turn Stack on for difference imaging</span>')+'</div>';
      if(!conf.length&&!SCAN.occ.length)
        html+='<div class="obj"><span class="nm">no change detected</span><span class="v">—</span></div>';
      conf.forEach(e=>{
        const dark=e.sign<0;
        html+='<div class="obj"><span class="nm"><span class="dot" style="background:'+
          (dark?'var(--dso)':'var(--planet)')+'"></span>'+
          (dark?'dark shape':'unexplained light')+'</span>'+
          '<span class="v">az '+Math.round(e.az)+'° · el '+Math.round(e.el)+'° · '+
          e.n+' frames · '+Math.abs(e.v).toFixed(0)+' contrast</span></div>';
      });
      SCAN.occ.slice(-4).reverse().forEach(o=>{
        html+='<div class="obj"><span class="nm"><span class="dot" style="background:var(--rad)"></span>'+
          o.name+' occulted</span><span class="v">'+Math.round(o.ms)+'ms · '+
          Math.round(o.depth*100)+'% deep · '+o.others+' stars steady</span></div>';
      });
    }

    /* active radiants */
    if(radUp.length)html+=radUp.map(r=>
      `<div class="obj"><span class="nm"><span class="dot" style="background:var(--rad)"></span>${r.name} radiant</span>`+
      `<span class="v">${r.up?`az ${Math.round(r.az)}° · el ${Math.round(r.el)}°`:'below horizon'} · pk ${r.peak} · ZHR ${r.zhr}</span></div>`).join('');
    else html+=`<div class="hint" style="padding:.25rem 0">no major meteor shower active</div>`;
    b.innerHTML=html;
  } else if(tab==='lock'){
    b.innerHTML=lockPanel();
  } else {
    if(!analysis){b.innerHTML='<div class="hint">Take a screenshot to extract point sources, their az/el, colour, and known-object matches (aircraft, sats, planets, stars, deep sky).</div>';return;}
    const head=`<div class="hint">${analysis.when} · GPS ${analysis.gps} · aim ${analysis.aim} · sky glow ${analysis.mean} · moon ${analysis.moon} · ${analysis.count} point sources</div>`;
    const rows=analysis.pts.map((p,i)=>{
      const azel=p.az==null?'—':`az ${Math.round(p.az)}° · el ${Math.round(p.el)}°`;
      const col=`rgb(${p.r},${p.g},${p.b})`;
      const tag=p.match==='UNMATCHED'?'<b style="color:var(--hit)">UNMATCHED</b>':p.match;
      return `<div class="obj"><span class="nm"><span class="dot" style="background:${col}"></span>#${i+1} ${tag}</span>`+
        `<span class="v">${azel} · L${Math.round(p.L)}</span></div>`;}).join('');
    b.innerHTML=head+rows;
  }
}

function lockPanel(){
  if(!LOCK.on)
    return '<div class="hint">Tap a light in the view to lock onto it, or press Lock to grab the '+
      'last flagged motion. The track is measured against the stars, so its speed across the sky '+
      'is real even though the phone is moving. Needs the camera and the compass on.</div>';
  const v=LOCK.verdict;
  if(!v||!v.st)
    return '<div class="hint">Tracking — hold the light near the reticle. '+
      LOCK.samples.length+' samples so far; a verdict needs about a second of steady track.</div>';
  const st=v.st,ph=v.ph,pos=v.pos;
  const head=v.kind==='match'?'var(--lock)':v.kind==='none'?'var(--hit)':
             v.kind==='insufficient'?'var(--dim)':'var(--planet)';
  const title=v.kind==='match'?'MATCH · '+v.best.name
            :v.kind==='conflict'?'NEAREST OBJECT DISAGREES'
            :v.kind==='insufficient'?'CANNOT ADJUDICATE'
            :v.kind==='near'?'NEAR THE LENS — NOT IN THE SKY'
            :'NO CATALOGUE MATCH';
  let h='<div class="verdict" style="border-left-color:'+head+'">'+
        '<span class="ttl" style="color:'+head+'">'+title+'</span>'+
        '<span class="sub">'+st.rate.toFixed(3)+'°/s · position angle '+Math.round(st.bearing)+'°</span>'+
        '<div class="hint" style="padding:.25rem 0 0">'+v.note+'</div></div>';
  h+='<div class="obj"><span class="nm">position</span><span class="v">az '+
     Math.round(pos.az)+'° · el '+Math.round(pos.el)+'°</span></div>';
  h+='<div class="obj"><span class="nm">track</span><span class="v">'+st.n+' samples · '+
     st.span.toFixed(1)+'s · scatter '+st.scatter.toFixed(2)+'°</span></div>';
  h+='<div class="obj"><span class="nm">pointing</span><span class="v">'+v.Q.aim+
     ' · gate ±'+v.Q.gate.toFixed(2)+'°</span></div>';
  if(v.psf)h+='<div class="obj"><span class="nm">blur vs stars</span><span class="v">'+
     v.psf.ratio.toFixed(2)+'× ('+v.psf.nStars+' stars)'+
     (v.psf.ratio>=1.6?' — resolved, near the lens':' — point source')+'</span></div>';
  if(ph)h+='<div class="obj"><span class="nm"><span class="dot" style="background:rgb('+
     ph.r+','+ph.g+','+ph.b+')"></span>light</span><span class="v">'+
     Math.round(ph.mean)+' over sky · var '+(ph.cv*100).toFixed(0)+'%'+
     (ph.flashHz>0.4?' · '+ph.flashHz.toFixed(1)+' Hz':'')+'</span></div>';

  h+='<div class="hint" style="padding:.35rem 0 .1rem">nearest catalogued objects</div>';
  if(!v.list.length)
    h+='<div class="obj"><span class="nm">nothing within '+(LOCK_GATE*2)+'°</span>'+
       '<span class="v">—</span></div>';
  v.list.forEach(c=>{
    const mark=c.vetoed?'✗ does not strobe':
      c.rateOk===true?'✓ motion fits':c.rateOk===false?'✗ motion differs':'· rate unknown';
    const col=c.vetoed?'var(--hit)':
      c.rateOk===true?'var(--lock)':c.rateOk===false?'var(--hit)':'var(--dim)';
    h+='<div class="obj"><span class="nm">'+c.name+
       ' <span style="color:var(--dim)">'+c.kind+(c.meta?' '+c.meta:'')+'</span></span>'+
       '<span class="v">'+c.sep.toFixed(2)+'° off'+(c.sep<=c.gate?'':' (outside gate)')+
       ' · <span style="color:'+col+'">'+mark+'</span>'+
       (c.rate!=null?' · '+c.rate.toFixed(3)+'°/s':'')+'</span></div>';
  });

  /* What "unidentified" is actually allowed to mean here. */
  const Q=v.Q;
  if(Q.blocking.length){
    h+='<div class="hint" style="padding:.4rem 0 .1rem;color:var(--hit)"><b>Why this cannot be settled</b></div>';
    Q.blocking.forEach(t=>h+='<div class="hint" style="padding:.1rem 0;color:var(--hit)">• '+t+'</div>');
  }
  h+='<div class="hint" style="padding:.35rem 0 0;color:var(--dim)">'+
     (v.kind==='insufficient'
       ? 'Nothing in the catalogues matched, but the checks above were not good enough to '+
         'call that meaningful — fix them and take the reading again. '
       : v.kind==='none'&&v.strobing
       ? 'It strobes like an aircraft beacon, which rules out the satellites and stars nearby '+
         'whatever their position says. No aircraft in the feed fits. '
       : v.kind==='none'
       ? 'No catalogued object sits within '+Q.gate.toFixed(2)+'° with matching motion. '+
         'That is unmatched against what this app can see, which is not the same as unexplained. '
       : v.kind==='conflict'
       ? 'The nearest object is close in the sky but moves differently, so the identification '+
         'is not supported. '
       : 'Matched on both position and motion. ')+
     'Standing limits: '+Q.issues.join('; ')+'.</div>';
  return h;
}
function stats_gen(){
  const g=SATENGINE.stats().generated;
  if(!g)return'';
  try{const h=Math.round((Date.now()-new Date(g).getTime())/3600000);
    return ` · TLEs ${h}h old`;}catch(_){return'';}
}

/* ============================ start up ============================ */
/* Runs last on purpose: these touch state declared all over the file, and a single
   temporal-dead-zone throw up here would kill every line after it. */
setSheetOpen(recall('sw.sheet',true));
setSetupOpen(recall('sw.setup',false));
setNight(recall('sw.night',false));
renderBar();
setInterval(renderBar,1000);

/* ============================ SATENGINE boot ============================ */
SATENGINE.init({
  catalogUrl:'catalog.json',
  onProgress:(l,t)=>{diag.sat='cat '+Math.round(100*l/t)+'%';renderDiag();},
  onReady:(c)=>{
    engineReady=true;diag.sat=c+' cat';renderDiag();
    if(me)SATENGINE.setObserver(me.lat,me.lon,me.alt||300);
    SATENGINE.start();startLoop();
    /* the catalog finishes loading long after the first taps — don't wipe a location
       or camera error the user still needs to read */
    if(!statusIsError())
      setStatus(c+' catalog objects tracking. Sunlit payloads drawn bright; tap Debris for rocket bodies + junk.','ok');
  },
  onError:(m)=>{
    diag.sat='no cat';renderDiag();
    setStatus('catalog.json not found — run the Space-Track Action first. CelesTrak "Load sats" still works meanwhile.','err');
  }
});
</script>
